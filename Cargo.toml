[workspace]
resolver = "3"
members = [
    "crates/fixed_math",
    "crates/sim",
    "crates/net",
    "crates/replay",
    "crates/render",
    "crates/input_touch",
    "crates/input_desktop",
    "crates/app",
    "crates/sync_test",
    "crates/replay_sync",
    "crates/replay_viewer",
    "crates/ice_vendor",
    "crates/tape_drop",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.95"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# The phone build shipped 21.4 MiB of symbol/debug sections inside
# libapp.so (69.0 -> 46.6 MiB under eu-strip, measured on apk-latest);
# mostly std's prebuilt debuginfo linking in. The determinism matrix runs
# the dev profile, so release symbols never feed a checksum, and the
# panic hook logs source locations from panic metadata, which stripping
# does not touch.
strip = "symbols"
