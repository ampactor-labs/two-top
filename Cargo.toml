[workspace]
resolver = "3"
members = [
    "crates/fixed_math",
    "crates/sim",
    "crates/net",
    "crates/replay",
    "crates/render",
    "crates/input_touch",
    "crates/input_desktop",
    "crates/app",
    "crates/sync_test",
    "crates/replay_sync",
    "crates/replay_viewer",
    "crates/ice_vendor",
    "crates/tape_drop",
]
# Third-party source carried for a backport (vendor/README.md). Not ours to
# lint or format: keep it out of `--workspace`.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
# The APK's versionName, and the source of its versionCode (cargo-apk
# derives both from this via `VersionCode::from_semver(..).to_code(1)`).
# Android's downgrade protection is keyed on versionCode, so this MUST
# rise on every published build or an older APK can reinstall over a
# newer one. Tracks the sim generation: 0.15.x ships SIM_VERSION 15, and
# the patch number rises for app-only builds (0.15.1: the Pixel launch fix,
# icon and bot ramp were published as 0.15.0, same versionCode as the APK
# that crashed).
version = "0.15.4"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.95"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# The phone build shipped 21.4 MiB of symbol/debug sections inside
# libapp.so (69.0 -> 46.6 MiB under eu-strip, measured on apk-latest);
# mostly std's prebuilt debuginfo linking in. The determinism matrix runs
# the dev profile, so release symbols never feed a checksum, and the
# panic hook logs source locations from panic metadata, which stripping
# does not touch.
strip = "symbols"

# One backported fix to bevy_render 0.18.1, which has no later 0.18.x
# release to move to: a swapchain acquire that times out or reports the
# surface lost skips the frame instead of panicking. On a phone that panic
# was a launch crash one step removed (vendor/README.md has the chain).
# Drop this table and `vendor/bevy_render` with the next Bevy upgrade.
[patch.crates-io]
bevy_render = { path = "vendor/bevy_render" }
