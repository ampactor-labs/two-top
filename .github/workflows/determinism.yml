name: Determinism

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  determinism:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            pkg-args: --workspace
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-latest
            pkg-args: --workspace
          - target: aarch64-apple-darwin
            runs-on: macos-14
            pkg-args: --workspace
          # aarch64-linux-android: fixed_math only. bevy 0.18 force-pulls
          # bevy_android via cfg(target_os="android"), which depends on
          # android-activity requiring game-activity or native-activity
          # features that bevy_internal doesn't expose for headless builds.
          # aarch64 instruction-set determinism is still covered by
          # aarch64-unknown-linux-gnu and aarch64-apple-darwin. Revisit when
          # NDK build infra lands later in BUILD_PLAN.
          - target: aarch64-linux-android
            runs-on: ubuntu-latest
            pkg-args: -p fixed_math
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: determinism-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run ${{ matrix.pkg-args }} --target ${{ matrix.target }} --locked
