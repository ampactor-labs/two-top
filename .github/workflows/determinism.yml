name: Determinism

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  determinism:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            pkg-args: --workspace
            replay-sync: true
          # Phase 7: `app` is excluded from non-native cross-builds —
          # bevy/wgpu pulls target-side X11/Wayland libs that the qemu and
          # macOS aarch64 cross-toolchains don't ship. The determinism
          # property is about sim, not render; render-layer rendering is
          # explicitly allowed to be platform-dependent (CONVENTIONS § Render
          # Layer Rules). Linux-x64 still builds the full workspace.
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-latest
            pkg-args: --workspace --exclude app
            replay-sync: true
          - target: aarch64-apple-darwin
            runs-on: macos-14
            pkg-args: --workspace --exclude app
            replay-sync: true
          # aarch64-linux-android: Phase 7.5 expanded scope from
          # `-p fixed_math` to `--workspace --exclude app`. The sim/replay/
          # render/sync_test/replay_sync crates compile for android via
          # the android-activity feature workaround in crates/sim/Cargo.toml.
          # `app` stays excluded — full bevy_winit + wgpu cross-build is
          # its own packaging story; locally use
          # `cargo apk run -p app --target aarch64-linux-android` once
          # the NDK and cargo-apk are installed (see SIDELOAD.md).
          - target: aarch64-linux-android
            runs-on: ubuntu-latest
            pkg-args: --workspace --exclude app
            replay-sync: false
    steps:
      - uses: actions/checkout@v5
      # Free disk on the GitHub-hosted Linux runners before building. The
      # `net` crate pulls the full webrtc dependency tree (webrtc → dtls/
      # srtp/ice/sctp/turn/…), which together with the cross-toolchain and
      # target artifacts pushed the aarch64-linux-android job over the
      # runner's disk ceiling ("No space left on device") — it only passed
      # on retry. Reclaiming the preinstalled Android SDK / .NET / GHC
      # toolchains (none of which this build uses) frees ~20 GB and makes
      # the build deterministic w.r.t. disk, not just lucky. Inline `rm`
      # rather than a third-party action to avoid a new CI dependency.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # Only the linux-x64 job builds the full workspace (incl. `app`, which
      # Task 5.3 gave a `bevy_audio` → `cpal` → `alsa-sys` build-time link).
      # The other targets use `--exclude app`, and `render` no longer pulls
      # cpal, so they need no ALSA headers.
      - name: Install ALSA dev headers (cpal build dep)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: determinism-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Non-android targets: build + run the test suite under nextest.
      - name: Run tests
        if: matrix.target != 'aarch64-linux-android'
        run: cargo nextest run ${{ matrix.pkg-args }} --target ${{ matrix.target }} --locked
      # Android: build-only via cargo build --tests. nextest can't *run*
      # tests under aarch64-linux-android without an android runtime, but
      # `cargo build --tests` exercises every test target's compilation
      # — which is the property the matrix is gating against.
      - name: Build tests (android)
        if: matrix.target == 'aarch64-linux-android'
        run: cargo build ${{ matrix.pkg-args }} --target ${{ matrix.target }} --locked --tests

      # Phase 5: per-frame, per-component checksum TSV from the canonical
      # demo. The matrix runs identical input through identical sim code on
      # each target; all surviving TSVs must be byte-identical to prove the
      # sim is portable.
      - name: Run replay_sync on canonical demo
        if: matrix.replay-sync
        run: |
          cargo run -p replay_sync --bin replay_sync \
            --target ${{ matrix.target }} --locked --release -- \
            --demo tests/demos/canonical/match_v1.bmrg \
            --output checksum-${{ matrix.target }}.tsv
      - name: Upload checksum TSV
        if: matrix.replay-sync
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.target }}
          path: checksum-${{ matrix.target }}.tsv
          if-no-files-found: error

  tsv-diff:
    name: cross-platform TSV diff
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: tsvs
      - name: Diff all TSVs against linux-x64 baseline
        run: |
          set -euo pipefail
          BASE="tsvs/checksum-x86_64-unknown-linux-gnu/checksum-x86_64-unknown-linux-gnu.tsv"
          if [[ ! -f "$BASE" ]]; then
            echo "missing baseline TSV at $BASE" >&2
            ls -laR tsvs >&2
            exit 1
          fi
          fail=0
          for d in tsvs/checksum-*; do
            name="$(basename "$d")"
            f="$d/${name}.tsv"
            if [[ ! -f "$f" ]]; then
              echo "missing TSV in $d" >&2
              fail=1
              continue
            fi
            if cmp -s "$BASE" "$f"; then
              echo "$f matches baseline"
            else
              echo "DIVERGE: $f differs from baseline"
              diff "$BASE" "$f" | head -40 || true
              fail=1
            fi
          done
          if [[ $fail -ne 0 ]]; then
            echo "Cross-platform TSV diff failed — see scripts/diagnose_desync.sh"
            exit 1
          fi
