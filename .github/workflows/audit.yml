name: Audit

# The workspace pins everything (`=` versions, committed lock, --locked
# everywhere) because toolchain and dependency drift are determinism risks
# (MORGAN_NOTES, CONVENTIONS). Pins need a complement: nothing would notice
# a RUSTSEC advisory against `fixed`, `cordic` (frozen upstream), `tiny_http`,
# or `ureq`. This job is that complement — weekly, and scheduled-only, so an
# advisory mails the owner instead of blocking a PR: pins move on evidence
# instead of noise.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Prebuilt binary, not `cargo install`: building cargo-audit from
      # source drags in deps whose MSRV outruns the pinned 1.95 toolchain,
      # which is what broke this job every Monday from 2026-08-03.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit
