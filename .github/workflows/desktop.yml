# The downloadable desktop app: Windows, macOS and Linux builds of the same
# game the phones run, published as the rolling `desktop-latest` release on
# every push to main (per-run artifacts too, as apk.yml does).
#
#   Windows  2-Top-windows-x86_64.zip      2-Top.exe + assets/
#   macOS    2-Top-macos-universal.zip     2-Top.app (arm64 + x86_64), ad-hoc signed
#   Linux    2-Top-linux-x86_64.tar.gz     two-top + assets/ + .desktop + icon
#
# The builds are unsigned (no Apple notarization, no Authenticode): the
# first launch shows the OS's unknown-developer prompt, and README walks
# through it. Online endpoints are baked exactly as for the APK, so a
# downloaded build plays on the public quick-match room out of the box.
# The packaged Linux build is launched once from its own folder under
# Xvfb + lavapipe and must render a frame without panicking — the proof
# that a shipped binary finds its assets without the build machine's path.

name: Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A change to the packaging itself is checked on its PR.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/desktop.yml
      - packaging/**
      - crates/app/src/platform/desktop.rs

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TWOTOP_ICE_URL: ${{ vars.TWOTOP_ICE_URL }}
  TWOTOP_ICE_KEY: ${{ secrets.TWOTOP_ICE_KEY }}
  TWOTOP_DROP_URL: ${{ vars.TWOTOP_DROP_URL }}
  TWOTOP_WATCH_URL: ${{ vars.TWOTOP_WATCH_URL }}

jobs:
  linux:
    name: Linux x86_64
    # 22.04 for an older glibc floor than ubuntu-latest's.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      # libxkbcommon-x11 is a RUNTIME dependency of the window layer (winit
      # loads it on X11): the bare runner lacks it and the first smoke run
      # panicked on it, which is how README came to list it.
      - name: System libraries (audio, controllers; Xvfb + lavapipe + xkbcommon for the smoke run)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config xvfb mesa-vulkan-drivers libxkbcommon-x11-0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-linux
      - name: Say whether this build can relay
        shell: bash
        env:
          TWOTOP_ICE_URL: ${{ vars.TWOTOP_ICE_URL }}
        run: |
          if [ -z "$TWOTOP_ICE_URL" ]; then
            echo "::warning title=No TURN relay::TWOTOP_ICE_URL is unset, so this build is STUN-only: two phones on mobile data (carrier NAT) will not connect. Deploy crates/ice_vendor and set the TWOTOP_ICE_URL repo variable (SIGNALING.md)."
          fi
      - name: Room server (deploy/endpoints.env unless the repo variable says otherwise)
        shell: bash
        env:
          ROOM_VAR: ${{ vars.TWOTOP_ROOM }}
        run: |
          . deploy/endpoints.env
          echo "TWOTOP_ROOM=${ROOM_VAR:-$TWOTOP_ROOM_DEFAULT}" >> "$GITHUB_ENV"
          echo "baking room server ${ROOM_VAR:-$TWOTOP_ROOM_DEFAULT}"
      - name: Build
        run: cargo build -p app --bin app --release --locked --features gamepad
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist/2-Top
          cp target/release/app dist/2-Top/two-top
          cp -r assets dist/2-Top/assets
          rm -rf dist/2-Top/assets/concepts
          cp packaging/linux/two-top.desktop dist/2-Top/
          cp web/icon-512.png dist/2-Top/two-top.png
          tar -czf 2-Top-linux-x86_64.tar.gz -C dist 2-Top
          ls -la 2-Top-linux-x86_64.tar.gz
      - name: Smoke run of the packaged build, from its own folder
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && tar -xzf 2-Top-linux-x86_64.tar.gz -C /tmp/smoke
          cd /tmp/smoke
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          HOME=/tmp/smoke/home TWOTOP_WINDOW=540x1170 TWOTOP_CAPTURE=/tmp/smoke/shot.png \
            TWOTOP_CAPTURE_FRAMES=120 timeout 180 \
            xvfb-run -a -s "-screen 0 1280x1400x24" ./2-Top/two-top > run.log 2>&1 || { tail -40 run.log; exit 1; }
          test -s shot.png || { echo "no frame captured"; tail -40 run.log; exit 1; }
          if grep -q "PANIC" run.log; then tail -40 run.log; exit 1; fi
          echo "captured $(stat -c %s shot.png) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: 2-Top-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-windows
      - name: Room server (deploy/endpoints.env unless the repo variable says otherwise)
        shell: bash
        env:
          ROOM_VAR: ${{ vars.TWOTOP_ROOM }}
        run: |
          . deploy/endpoints.env
          echo "TWOTOP_ROOM=${ROOM_VAR:-$TWOTOP_ROOM_DEFAULT}" >> "$GITHUB_ENV"
          echo "baking room server ${ROOM_VAR:-$TWOTOP_ROOM_DEFAULT}"
      - name: Build
        run: cargo build -p app --bin app --release --locked --features gamepad
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist/2-Top
          cp target/release/app.exe dist/2-Top/2-Top.exe
          cp -r assets dist/2-Top/assets
          rm -rf dist/2-Top/assets/concepts
          cd dist && 7z a -tzip ../2-Top-windows-x86_64.zip 2-Top > /dev/null
          ls -la ../2-Top-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: 2-Top-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Both architectures
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-macos
      - name: Room server (deploy/endpoints.env unless the repo variable says otherwise)
        shell: bash
        env:
          ROOM_VAR: ${{ vars.TWOTOP_ROOM }}
        run: |
          . deploy/endpoints.env
          echo "TWOTOP_ROOM=${ROOM_VAR:-$TWOTOP_ROOM_DEFAULT}" >> "$GITHUB_ENV"
          echo "baking room server ${ROOM_VAR:-$TWOTOP_ROOM_DEFAULT}"
      - name: Build
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build -p app --bin app --release --locked --features gamepad --target "$t"
          done
      - name: Bundle 2-Top.app
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP=2-Top.app/Contents
          mkdir -p "$APP/MacOS" "$APP/Resources"
          lipo -create -output "$APP/MacOS/2-Top" \
            target/aarch64-apple-darwin/release/app target/x86_64-apple-darwin/release/app
          cp -r assets "$APP/Resources/assets"
          rm -rf "$APP/Resources/assets/concepts"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Info.plist"
          mkdir two-top.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s web/icon-512.png --out two-top.iconset/icon_${s}x${s}.png > /dev/null
            d=$((s * 2)); [ $d -le 512 ] && sips -z $d $d web/icon-512.png --out two-top.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns two-top.iconset -o "$APP/Resources/two-top.icns"
          # Ad-hoc signature: required for an arm64 binary to launch at all;
          # not a developer identity, so Gatekeeper still asks once.
          codesign --force --deep --sign - 2-Top.app
          lipo -info "$APP/MacOS/2-Top"
          ditto -c -k --keepParent 2-Top.app 2-Top-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: 2-Top-macos-universal.zip
          if-no-files-found: error

  publish:
    name: publish desktop-latest
    needs: [linux, windows, macos]
    # Main only. Linux and Windows must have built; macOS ships when its
    # runner ran (it is left out of the release, not the reason to skip it).
    if: >-
      !cancelled() && github.event_name != 'pull_request' &&
      needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish rolling desktop-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release delete desktop-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create desktop-latest dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest desktop builds (${GITHUB_SHA::7})" \
            --notes "Windows, macOS and Linux builds of commit ${GITHUB_SHA}. Unsigned: see README (Desktop) for the one-time prompt on first launch. Plays on the public quick-match room by default." \
            --prerelease
