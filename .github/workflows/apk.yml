# Build the sideloadable Android APK on every push to main and publish it
# two ways: as a per-run artifact (audit trail, 90-day retention) and as
# the rolling `apk-latest` GitHub release, so the newest build is always
# one stable URL away:
#
#   https://github.com/ampactor-labs/two-top/releases/download/apk-latest/two-top.apk
#
# The build mirrors scripts/phone.sh: cargo-apk, release profile, the
# public Railway quick-match room baked via TWOTOP_ROOM (a repo/org
# variable overrides it; it is not a secret — the same URL ships in
# phone.sh). The public APK is deliberately STUN-only: TWOTOP_TURN_*
# credentials are compile-time-baked and trivially extractable from any
# distributed binary, so they must NEVER enter a publicly downloadable
# build. TURN-enabled builds stay local (scripts/phone.sh with the env
# set) or move to short-lived credentials before they ever ship.
#
# Signing: sideload builds are debug-key signed. The keystore is kept in
# the actions cache so consecutive builds share a key (Android refuses an
# update signed by a different key — a cache miss means one manual
# uninstall/reinstall on the phone). For a permanently stable key, set a
# base64 `APK_KEYSTORE` secret and swap the generate step for a decode.

name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: build + publish APK
    runs-on: ubuntu-latest
    env:
      # Secrets are not readable inside step `if:` expressions directly;
      # surface the presence check through job env.
      HAS_APK_KEYSTORE: ${{ secrets.APK_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v5
      # Free disk like the determinism matrix does — but KEEP the Android
      # SDK/NDK (this is the one workflow that needs it). The webrtc tree +
      # cross-target artifacts are what blow the disk ceiling.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Add Android target
        run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: apk-aarch64-linux-android
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked || cargo install cargo-apk
      # Signing key, in priority order: the APK_KEYSTORE secret (base64 of
      # the dev box's debug keystore, storepass "android") so CI releases
      # install OVER phone.sh sideloads without an uninstall; else a
      # keystore cached across runs; else generate fresh. Android refuses
      # an update signed with a different key and reports the refusal as a
      # bare "App not installed" — one key everywhere ends that class.
      - name: Materialize signing keystore (secret)
        if: env.HAS_APK_KEYSTORE == 'true'
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE }}
        run: printf '%s' "$APK_KEYSTORE_B64" | base64 -d > debug.keystore
      - name: Restore signing keystore (cache fallback)
        id: keystore
        if: env.HAS_APK_KEYSTORE != 'true'
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: apk-debug-keystore-v1
      - name: Generate signing keystore (cache miss)
        if: env.HAS_APK_KEYSTORE != 'true' && steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Build release APK
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ github.workspace }}/debug.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
          TWOTOP_ROOM: ${{ vars.TWOTOP_ROOM || 'wss://two-top-matchbox-production.up.railway.app/two-top?next=2' }}
          # The ephemeral-ICE vendor URL (crates/ice_vendor). A URL, not a
          # credential — safe in a public binary. Unset ⇒ STUN-only, as now.
          TWOTOP_ICE_URL: ${{ vars.TWOTOP_ICE_URL }}
          # The vendor's optional X-App-Key turnstile. Extractable from the
          # APK (any baked string is), so it filters scrapers rather than
          # authenticating anyone; a secret only to keep it out of the repo.
          # Unset ⇒ header omitted, which an open vendor accepts.
          TWOTOP_ICE_KEY: ${{ secrets.TWOTOP_ICE_KEY }}
        run: |
          # Runner-image env (ANDROID_NDK_LATEST_HOME) is process env, not
          # expression-time `env:` context — resolve it in the shell.
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_ROOT"
          # cargo-apk's CLI doesn't pass --locked through; the committed
          # Cargo.lock still pins the graph (same invocation as phone.sh).
          cargo apk build -p app --lib --target aarch64-linux-android --release
          cp target/release/apk/app.apk two-top.apk
          ls -la two-top.apk
      # 16 KB ELF page alignment is load-bearing on Android 15 phones
      # (crates/app/build.rs). Fail the workflow if it ever regresses —
      # a misaligned APK installs but crashes at launch.
      - name: Verify 16 KB page alignment
        run: |
          unzip -o two-top.apk "lib/arm64-v8a/libapp.so" -d apk-check
          # String-compare the LOAD align field (mawk has no strtonum):
          # 0x4000 (16 KB) or 0x10000 (64 KB) pass; anything else regressed.
          readelf -lW apk-check/lib/arm64-v8a/libapp.so \
            | awk '/LOAD/ {print; if ($NF != "0x4000" && $NF != "0x10000") bad=1} END {exit bad}'
      # The alignment check reads the ELF; nothing was reading the
      # SIGNATURE, which is how a wrong-key build shipped silently once.
      # Print the cert so every run's log shows who signed it.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs two-top.apk
      - name: Upload per-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: two-top-apk-${{ github.sha }}
          path: two-top.apk
          if-no-files-found: error
      - name: Publish rolling apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest two-top.apk \
            --title "Latest APK (${GITHUB_SHA::7})" \
            --notes "Sideloadable release build of commit ${GITHUB_SHA}. Install per SIDELOAD.md; pairs on the public quick-match room by default." \
            --prerelease
