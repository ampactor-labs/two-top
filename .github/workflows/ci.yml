name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: check / test / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Phase 18 Task 5.3 added `bevy_audio` to the `app` crate, which pulls
      # `cpal` → `alsa-sys`, a build-time link against libasound. The workspace
      # build includes `app`, so the runner needs the ALSA dev headers.
      - name: Install ALSA dev headers (cpal build dep)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # First: cheapest gate, catches drift the toolchain's own component
      # can fix locally with one `cargo fmt`. The tree was normalized in one
      # behavior-neutral commit; this step is what keeps it that way.
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo nextest run --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The browser build is a THIRD platform with its own cfg arms, and
      # nothing here ever compiled it — a wasm-only type error or a
      # function left dead by a gate change reached main and waited for
      # the (slow, main-only) wasm determinism lane to notice. Checking
      # the lib for wasm32 is seconds and closes that window.
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy -p app --lib --locked --target wasm32-unknown-unknown -- -D warnings

  art:
    name: art gates (palette + silhouette)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      # The consistency backbone of the pixel atelier (docs/STYLE_BIBLE.md):
      # every shipped sprite stays locked to the 16-color palette, and the two
      # duelists must read apart by silhouette, not color (audit D-VQ-01).
      - run: python3 scripts/check_palette.py
      - run: python3 scripts/check_silhouettes.py

  # The APK workflow only runs on a push to main, and nothing else in the
  # tree reads [package.metadata.android] — so a manifest mistake stayed
  # invisible until it had already broken the published release (cargo-apk
  # panics at config-parse time on a version_code/version_name it derives
  # itself). These are the parse-time rules plus the two ship blockers
  # that can ride a green build; seconds, no NDK, every branch and PR.
  manifest:
    name: android manifest gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_android_manifest.py
      # `not(target_os = "android")` reads like "desktop" and means
      # "desktop AND the browser". That one habit shipped a web build
      # whose only input source was a keyboard, on a touchscreen.
      - run: python3 scripts/check_platform_gates.py
