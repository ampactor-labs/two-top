name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: check / test / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Phase 18 Task 5.3 added `bevy_audio` to the `app` crate, which pulls
      # `cpal` → `alsa-sys`, a build-time link against libasound. The workspace
      # build includes `app`, so the runner needs the ALSA dev headers.
      - name: Install ALSA dev headers (cpal build dep)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo check --workspace --locked
      - run: cargo nextest run --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
