[package]
name = "render"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# Phase 15 cycle 2: render now owns the EffectSprite + ambient-ember
# spawner systems, so it needs the sprite/asset/render features
# beyond the minimal Phase-7 sim/render-boundary setup. This matches
# CONVENTIONS § Module Boundaries which lists render's bevy as
# "(full)". Still no `bevy_winit` / `bevy_window` here — the binary
# crates own windowing.
bevy = { version = "=0.18.1", default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    # The sprite + text DRAW pipeline. Bevy 0.18 split every renderable crate
    # into a data half and a render half: `bevy_sprite` alone gives only the
    # `Sprite`/`TextureAtlas` *components*, and `bevy_text` only the text data —
    # the systems that actually rasterize them live behind `bevy_sprite_render`
    # (and `bevy_text` routes its glyph draw through it). Without this, every
    # sprite and every `Text2d` spawns, passes visibility/frustum culling, and
    # then silently never draws (no error — the draw machinery simply isn't
    # installed), so the whole window is just the camera clear color. Carried
    # over from a pre-0.18 feature list where `bevy_sprite` still bundled its
    # renderer; the determinism matrix is headless so CI never caught it. On
    # `render` (the rendering crate) so unification covers every rendering
    # binary — app, replay_viewer — from one place.
    "bevy_sprite_render",
    # The PNG codec. `bevy_image`'s default features do NOT include any image
    # format, so with `default-features = false` Bevy can neither decode nor
    # encode PNG. EVERY runtime texture (sprites, arena floors, HUD atlases) is
    # a `.png`, so without this the AssetServer loads the bytes but produces no
    # texture and the whole scene renders blank. Lives on `render` — the crate
    # that draws the sprites — so feature-unification covers every rendering
    # binary (app, replay_viewer) from one place.
    "png",
] }
fixed_math = { path = "../fixed_math" }
sim = { path = "../sim" }
# Render-side RNG for cosmetic spawning (ambient embers, particle
# scatter). Per CONVENTIONS § Render Layer Rules: "Visual RNG is
# separate. Use a different RNG for cosmetic randomness; never read
# from SimRng." `rand` + `rand_xoshiro` keep us deterministic on a
# per-process basis (tests can seed it) without touching the sim's
# rolled-back stream.
rand = { version = "0.8", default-features = false, features = ["std", "std_rng", "small_rng"] }
