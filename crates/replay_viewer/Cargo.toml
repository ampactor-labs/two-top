[package]
name = "replay_viewer"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# Phase 14 cycle 1: deterministic replay-driven sim rendered in a
# bevy window. Mirrors the app crate's bevy feature set so the viewer
# composes the same DefaultPlugins + sprite/text stack the live game
# uses; the rendering is identical so a watcher sees exactly what the
# match looked like to its players.
bevy = { version = "=0.18.1", default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "default_font",
    "x11",
] }
bevy_ggrs = "=0.21"
fixed_math = { path = "../fixed_math" }
render = { path = "../render" }
replay = { path = "../replay" }
sim = { path = "../sim" }
