[package]
name = "app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# cdylib for android: cargo-apk packages this into the APK as
# libapp.so; the system NativeActivity dlopens it and calls
# android_main (generated by #[bevy_main] in lib.rs).
# rlib so src/main.rs (desktop binary) can link against the library
# and call app::run().
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "app"
path = "src/main.rs"

[features]
default = []
# Controller support. Off by default so the standard keyboard build needs
# no system libraries; the gilrs backend pulls `libudev-sys`, which on
# Linux needs `libudev` dev headers (Fedora: `libudev-devel`, Debian:
# `libudev-dev`). Build with `--features gamepad` to play with controllers.
# input_desktop's gamepad *code* always compiles (Bevy's `gamepad` type
# feature has no system dep); without this backend the gamepad query is
# just empty and the keyboard drives play.
gamepad = ["bevy/bevy_gilrs"]

[dependencies]
# `app` is the only crate in the workspace that needs windowing,
# rendering, and font/text infra. CONVENTIONS keeps these features out
# of `sim` and `render` so the determinism core stays headless. The
# Linux platform list intentionally pins x11 only — adding wayland pulls
# in `wayland-client.pc` which most CI runners (and many dev boxes)
# don't ship by default. Local Wayland users can rebuild with
# `--features bevy/wayland`.
bevy = { version = "=0.18.1", default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    # Phase 19 — HDR + thresholded bloom for the HLD glow (eye-slits, boomerang,
    # hit/kill flashes). Pulls in `bevy::post_process::bloom`.
    "bevy_post_process",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "default_font",
    "x11",
    # Phase 18 Task 5.3 — synthesized audio. `bevy_audio` makes
    # `DefaultPlugins` include `AudioPlugin` (the audio-device owner); `wav`
    # adds the decoder for the generated `assets/audio/*.wav` cues. This `app`
    # crate hosts the playback systems (`GameAudioPlugin` in `src/audio.rs`) —
    # audio is a device concern, kept out of `render` so the determinism
    # matrix never pulls `cpal`.
    "bevy_audio",
    "wav",
] }
bevy_ggrs = "=0.21"
fixed_math = { path = "../fixed_math" }
input_touch = { path = "../input_touch" }
# Desktop keyboard input source (PC couch versus + PC online). Only its
# ReadInputs system is wired in on non-android targets; android keeps the
# touch source. Pulls the `keyboard` bevy feature in transitively.
input_desktop = { path = "../input_desktop" }
net = { path = "../net" }
render = { path = "../render" }
# Match recorder: every decided match is written out as a shareable .bmrg
# replay (the deterministic sim makes the input tape a perfect recording).
replay = { path = "../replay" }
sim = { path = "../sim" }
# Cosmetic-only RNG for the screen-shake direction (Phase 18). Reads the
# render crate's `CosmeticRng` (never `SimRng` — shake must never feed back
# into rolled-back state). Mirrors render's feature set; cargo unifies it.
rand = { version = "0.8", default-features = false, features = ["std", "std_rng", "small_rng"] }

# Phase 13 — diagnostic logging. The app crate owns the subscriber
# setup; other crates emit through `tracing::*` (or bevy_log's re-export
# of the same macros). `release_max_level_info` is a `tracing`-crate
# cargo feature that compiles `debug!` / `trace!` calls down to no-ops
# in release across the entire dep graph (cargo unifies features), so
# release builds never pay the per-call dispatch cost or the message
# formatting cost for verbose levels.
tracing = { version = "0.1", default-features = false, features = [
    "std",
    "release_max_level_info",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
    "registry",
    "std",
] }
# tracing-appender's RollingFileAppender writes to a directory with
# date-stamped filenames. Used for the release file-output path; dev
# builds skip the appender entirely and write to stderr.
tracing-appender = "0.2"

# Phase 18 Task 5.5c — persisted settings (deadzone, haptics, volumes) as
# JSON in the platform config dir. `serde`/`serde_json` are already in the
# tree (postcard replay codec); `dirs` resolves the per-OS config directory.
# On Android `dirs` may not resolve a path — settings then stay in-memory
# (persistence is a desktop convenience; not load-bearing).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# The install identity (profile.rs) mints one random u128 per install.
# uuid v4 is the tree's existing randomness-with-no-ceremony source —
# matchbox already pulls uuid; net uses it for the PeerId bijection.
uuid = { version = "1", features = ["v4"] }

# Phase 18 Task 5.4 — Android haptics. JNI hop to the platform `Vibrator`
# via the activity handle from `ndk-context`. Android-only target deps so the
# desktop build never pulls them; on desktop `vibrate` is a no-op. Versions
# pinned to the copies already in the lock (via the android-activity stack)
# so no new crate version is introduced.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# cargo-apk metadata for sideloading to Android dev devices.
# See SIDELOAD.md for the full walkthrough. The repo identifier is
# `two-top` and the crate is `two_top` because Java package segments
# and Rust crate names can't start with a digit; the user-facing
# display name is "2-Top".
[package.metadata.android]
package = "com.ampactorlabs.twotop"
build_targets = ["aarch64-linux-android"]
strip = "default"
# Bundle the runtime assets into the APK. The app loads sprites
# (assets/sprites/**), the arena floor, and the 12 synthesized audio cues
# (assets/audio/*.wav) via the AssetServer at runtime; without this the
# sideloaded build launches with blank textures and no sound. cargo-apk
# resolves this path relative to THIS manifest, and the assets dir lives at the
# workspace root, so it is `../../assets`. The bundled dir becomes the APK
# asset root, so the in-code load paths ("audio/throw.wav", "sprites/...") line
# up unchanged. (Verify on first sideload — SIDELOAD.md.)
assets = "../../assets"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Phase 18 haptics (crates/app/src/haptics.rs) call the Android Vibrator via
# JNI; without VIBRATE the call throws a (swallowed) SecurityException and
# haptics silently never fire. Required for the on-device haptic feel.
[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = true

[package.metadata.android.application]
label = "2-Top"
debuggable = true
theme = "@android:style/Theme.Black.NoTitleBar.Fullscreen"
extract_native_libs = true
# Local same-Wi-Fi play uses a ws:// signaling URL hosted on the laptop.
uses_cleartext_traffic = true

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|keyboardHidden|screenSize"
launch_mode = "singleTask"
exported = true
