[package]
name = "net"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# matchbox_socket without its `ggrs` feature: that feature is pinned to
# ggrs ^0.11, but bevy_ggrs 0.21 (our pinned version) uses ggrs ^0.12.
# We supply our own bridge instead — see crates/net/src/lib.rs §
# MatchboxBridge. (Phase 12 follows the same playbook as cutting
# bevy_roll_safe in Phase 11: when the dep ecosystem lags our pinned
# version, write the small adapter ourselves.)
matchbox_socket = { version = "0.14", default-features = false }
ggrs = { version = "0.12", default-features = false }
bincode = { version = "2.0", default-features = false, features = [
    "serde",
    "alloc",
] }
# The reliable side-channel (channel 1: identity handshake, rematch
# consent, clean goodbye) speaks postcard — the project's serialization
# convention (MORGAN_NOTES § postcard over bincode). The bincode above
# exists only to mirror matchbox's ggrs reference codec byte-for-byte
# on channel 0.
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive"] }
# Phase 13: tracing replaces the prior `log` crate dependency. bevy_log
# (already enabled below) routes `tracing` events through whatever
# subscriber the app crate installs; here we just emit. Default-features
# off to keep the dep skinny — `std` is the only one we use.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The ggrs `Config::Address` slot is `sim::NetAddr(u128)` so the
# determinism core stays free of any networking crate. The bridge maps
# that neutral handle to/from matchbox's `PeerId(Uuid)` via a trivial
# u128 bijection, so we call `Uuid::from_u128` / `Uuid::as_u128` here.
# matchbox already pulls uuid transitively; declaring it explicitly
# makes the bridge's dependency obvious.
uuid = "1"
# NORTH N2/N3 — the width-stable checksum hasher lives here so the
# online desync checksums (app) and the offline fingerprint tool
# (replay_sync) share one implementation. Same SeaHasher bevy_ggrs uses.
seahash = "4"
# NORTH N2 — signed results. All ed25519 lives here so app and
# replay_sync share one implementation: sign_statement / verify /
# pubkey_for. default-features off ("fast" precomputed tables are for
# servers verifying at volume; a duel signs and verifies once).
ed25519-dalek = { version = "=2.2.0", default-features = false, features = [
    "std",
] }
# Bevy without render features — same posture as the sim crate.
# We need `Resource` and the plugin/system traits, nothing else.
bevy = { version = "=0.18.1", default-features = false, features = [
    "std",
    "bevy_log",
] }
# net depends on sim for `FrameCount` (the disconnection countdown
# is frame-counted so peers agree on time-since-silence the same way
# they agree on positions) and `MatchState` (forfeit transitions
# `Forfeited` -> `MatchState::MatchOver` so the in-sim view of "match
# ended" is the rolled-back source of truth).
sim = { path = "../sim" }

# (uuid is a normal dependency above — the bridge needs it at build
# time, not just in tests.)
