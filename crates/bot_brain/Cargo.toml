[package]
name = "bot_brain"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The practice bot's brain: reads sim components, answers wire inputs. No
# rendering, no windowing, so the headless bench can drive it too.
bevy = { version = "=0.18.1", default-features = false, features = ["std"] }
# The bench (`src/bench.rs`) drives whole headless matches through a
# SyncTest session, the way replay_sync does.
bevy_ggrs = "=0.21"
fixed_math = { path = "../fixed_math" }
sim = { path = "../sim" }
