[package]
name = "sim"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", default-features = false, features = ["derive"] }
bevy = { version = "=0.18.1", default-features = false, features = ["std", "bevy_log"] }
bevy_ggrs = "=0.21"
fixed_math = { path = "../fixed_math" }
# Phase 13: emit lifecycle/round-flow events via tracing. The
# subscriber lives in the app crate; sim only emits.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Android workaround. bevy_internal force-pulls bevy_android under
# `cfg(target_os = "android")`, which depends on `android-activity = "0.6"`
# without enabling either of its mutually-exclusive `game-activity` /
# `native-activity` features. android-activity emits a compile_error
# unless one is set. Adding android-activity here as a target-gated
# direct dep unifies the feature across the dep graph for android
# builds and is a no-op on every other target.
#
# Choice of `native-activity`: vanilla cargo-apk (rust-mobile/cargo-apk)
# generates a manifest pointing at android.app.NativeActivity, which
# ships in every Android system framework. Switching to game-activity
# would require packaging the AndroidX GameActivity JAR into the APK,
# which vanilla cargo-apk doesn't do — that needs cargo-apk2 / xbuild.
# 2-Top is touch-first; gamepad routing (game-activity's headline
# advantage) isn't on the roadmap today. If/when it lands, this is a
# one-feature-flip plus a packager swap.
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
